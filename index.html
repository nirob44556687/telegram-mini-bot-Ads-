function payLogo(m,c){if(c&&c.trim().length>4)return `<img src="${c.trim()}" style="width:100%;height:100%;object-fit:cover">`;return m==="BKASH"?BKASH_SVG:m==="NAGAD"?NAGAD_SVG:`<div style="width:100%;height:100%;background:var(--rose);display:grid;place-items:center;font-weight:900">${(m||"PM").slice(0,2)}</div>`;}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hide");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add("hide"),2600);}
function copyNum(l,n){navigator.clipboard?.writeText(n).catch(()=>{});toast(l+" number copied: "+n);}

function goTab(tab, focusVideoId){

  ["Home","Videos","Call","Wallet","Profile"].forEach(t=>{
    document.getElementById("tab"+t).classList.toggle("hide",t!==tab);

    renderVideos();
    setTimeout(()=>{if(focusVideoId){const el=document.getElementById("reel_"+focusVideoId);if(el)el.scrollIntoView();}autoPlayVisible();},90);

function togglePlay(id){const v=document.getElementById("vid_"+id);if(!v)return;if(v.paused){v.muted=isMuted;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});}else v.pause();}
function toggleMute(){isMuted=!isMuted;document.querySelectorAll("#reelsBox video").forEach(v=>v.muted=isMuted);renderVideos();setTimeout(autoPlayVisible,60);toast(isMuted?"Video sound muted":"Sound turned ON 🔊");}
function cycleQuality(){quality=quality==="1080p"?"720p":quality==="720p"?"Auto":"1080p";renderVideos();setTimeout(autoPlayVisible,60);toast("Video Quality: "+quality);}
function seekVid(id,pct){const v=document.getElementById("vid_"+id);if(v&&v.duration)v.currentTime=(pct/100)*v.duration;}
function onVidTime(id,unlocked){
  const v=document.getElementById("vid_"+id);if(!v||!v.duration)return;
  if(!unlocked&&v.currentTime>=15)v.currentTime=0;
  const r=document.getElementById("rng_"+id),tm=document.getElementById("tm_"+id);
  if(r)r.value=(v.currentTime/v.duration)*100;if(tm)tm.textContent=fmtTime(v.currentTime)+" / "+fmtTime(v.duration);
}
function goFsVid(id){const v=document.getElementById("vid_"+id);if(v)(v.requestFullscreen||v.webkitEnterFullscreen||(()=>{})).call(v);}
function autoPlayVisible(){
  document.querySelectorAll("#reelsBox video").forEach(v=>{
    const r=v.getBoundingClientRect();
    if(r.top>=-120&&r.top<window.innerHeight*0.55){v.muted=isMuted;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});}else v.pause();
  });
}
function likeVid(id){const v=DB.videos.find(x=>x.id===id);if(!v)return;v.likes=(Number(v.likes)||0)+1;saveDB(DB);const el=document.getElementById("lk_"+id);if(el)el.textContent=fmtK(v.likes);toast("Liked ❤️");}

      <input id="pAmt" class="inp" type="number" placeholder="Amount (BDT) e.g. 500"/>
      <input id="pSender" class="inp" placeholder="Your Sender Number (01XXXXXXXXX)"/>
      <input id="pTrx" class="inp" placeholder="Transaction ID (TrxID)"/>
      <button class="gbtn" style="margin-top:12px" onclick="submitTopUp()">✨ Submit Payment Request</button>
    </div>
    <div class="card"><div style="font-weight:900;margin-bottom:6px">Deposit History</div>
      ${myPays.length?myPays.map(p=>`<div class="pay-row"><div><b>${p.method} • ${p.amount} BDT</b><div style="font-size:11px;color:var(--muted)">Trx: ${p.trxId}</div></div><span class="pill">${p.status}</span></div>`).join(""):'<div style="font-size:12px;color:var(--muted)">No deposits yet.</div>'}
    </div>`;
}
function submitTopUp(){
  const amt=Number(document.getElementById("pAmt").value),sender=document.getElementById("pSender").value.trim(),trx=document.getElementById("pTrx").value.trim();
  if(amt<50||!sender||!trx){toast("Enter Amount (50+), Sender Number & TrxID");return;}
  DB.payments.unshift({id:"PAY"+Date.now(),userId:ME.id,username:ME.displayName,method:selMethod,amount:amt,sender,trxId:trx,status:"PENDING",at:new Date().toLocaleString()});
  saveDB(DB);renderWallet();toast("Payment sent! Waiting for Admin approval.");
}
function renderProfile(){
  const myOrd=DB.orders.filter(o=>o.userId===ME.id);
  document.getElementById("tabProfile").innerHTML=`
    <div class="hdr"><div style="font-weight:900;font-size:18px;color:var(--gold2)">👤 My Profile</div><button class="ibtn" onclick="powerOff()">⏻</button></div>
    <div class="card" style="display:flex;align-items:center;gap:14px">
      <img src="${ME.photoUrl}" style="width:68px;height:68px;border-radius:50%;object-fit:cover;border:2.5px solid var(--gold2)"/>
      <div><div style="font-weight:900;font-size:18px">${ME.displayName} ✓</div><div style="font-size:12px;color:#FF9AD5">ID: ${ME.royalId} • Key: ${ME.accessKey}</div></div>
    </div>
    <div class="card">
      <div style="font-weight:900;color:var(--gold2);margin-bottom:6px">✏️ Edit Name &amp; Profile Photo Link</div>
      <input id="uName" class="inp" value="${ME.displayName}"/>
      <input id="uPic" class="inp" value="${ME.photoUrl}" placeholder="Direct Image URL"/>
      <button class="gbtn" style="margin-top:10px" onclick="saveProfile()">💾 Save Profile</button>
    </div>
    <div class="card"><div style="font-weight:900;color:var(--gold2);margin-bottom:6px">🛍 My Orders &amp; Purchases (${myOrd.length})</div>
      ${myOrd.length?myOrd.map(o=>`<div class="pay-row"><div><b>${o.serviceTitle}</b><div style="font-size:11px;color:var(--muted)">${o.girlName} • ${o.status} • ${o.at}</div></div><b style="color:#FF77B7">-${o.amount}৳</b></div>`).join(""):'<div style="font-size:12px;color:var(--muted)">No service orders yet.</div>'}
    </div>`;
}
function saveProfile(){ME.displayName=document.getElementById("uName").value.trim()||ME.displayName;ME.photoUrl=document.getElementById("uPic").value.trim()||ME.photoUrl;saveDB(DB);renderAll();toast("Profile updated!");}
function openFs(list,i){fsList=list&&list.length?list:DB.photos;fsIdx=i||0;updateFs();document.getElementById("fsViewer").classList.remove("hide");}
function closeFs(){document.getElementById("fsViewer").classList.add("hide");}
function stepFs(d){fsIdx=(fsIdx+d+fsList.length)%fsList.length;updateFs();}
function updateFs(){const p=fsList[fsIdx];if(!p)return;document.getElementById("fsImg").src=p.imageUrl;document.getElementById("fsTitle").textContent=p.title;document.getElementById("fsCap").textContent=p.caption;document.getElementById("fsCounter").textContent=(fsIdx+1)+" / "+fsList.length;}
function toggleFsChrome(){document.getElementById("fsTop").classList.toggle("hide");document.getElementById("fsBot").classList.toggle("hide");}
function renderAll(){if(!ME)return;renderHome();renderGirlsDir();renderWallet();renderProfile();if(curTab==="Videos")renderVideos();if(openGirlId)renderGirlSheet();}

(function init(){
  document.getElementById("pwrCrown").innerHTML=CROWN_SVG;
  document.getElementById("pwrBg").src=DB.settings.heroBannerUrl||PRESETS[0];
  if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
  if(fbRef){
    fbRef.on("value",snap=>{
      const val=snap.val();
      if(val){DB=mergeDB(val);localStorage.setItem(DB_KEY,JSON.stringify(DB));}
      else{fbRef.set(DB).catch(()=>{});}
      document.getElementById("syncBadge").textContent="🟢 Live Firebase Connected";
      document.getElementById("pwrBg").src=DB.settings.heroBannerUrl||PRESETS[0];
      if(ME){ME=DB.users.find(u=>u.id===ME.id)||ME;renderAll();}
    },()=>{document.getElementById("syncBadge").textContent="✨ Ready (Local Mode)";});
  }
  if(localStorage.getItem(UID_KEY)) powerStart(false);
})();
</script>
</body>
</html>
